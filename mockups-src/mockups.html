<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mockups – Planner Cristão 2027</title>
<!--
  Fonte dos mockups. Cada cena é escolhida pelo #hash da URL:
  #hero  #mesa  #tablet  #espiral  #og  #page-<nome>
  Renderize com o script render.sh (Chrome headless).
-->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFDF9; --cream:#F1E7DA; --rose:#E9CFC6; --rose2:#C99A93; --terra:#6E2537;
  --gold:#B08A4A; --olive:#5E6B47; --olivel:#DCDFCC; --ink:#2B2422; --muted:#6B5E58; --line:#E8DCCF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;width:100%;height:100%}
body{position:relative;font-family:Inter,sans-serif;color:var(--ink)}
.abs{position:absolute;transform-origin:0 0}

/* ---------- página A4 base (420 x 594) ---------- */
.pg{position:relative;width:420px;height:594px;padding:26px 28px;font-size:8px;line-height:1.4;overflow:hidden;
  background:radial-gradient(circle at 20% 10%,#fff 0,rgba(255,255,255,0) 60%),var(--paper)}
.shadow{box-shadow:0 1px 2px rgba(70,45,30,.14),0 14px 34px -10px rgba(70,45,30,.35)}
.k{font-size:6.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600}
.t{font-family:'Playfair Display',serif;font-weight:500;font-size:23px;line-height:1.1;margin:3px 0 2px}
.t i{color:var(--terra)}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),rgba(176,138,74,0));margin:7px 0 10px}
.v{border-left:2px solid var(--gold);padding:5px 0 5px 9px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10.5px;line-height:1.3;background:linear-gradient(90deg,#FBF3E8,rgba(251,243,232,0))}
.v b{display:block;font-family:Inter;font-style:normal;font-size:6px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:2px;font-weight:500}
.box{border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:rgba(255,255,255,.55)}
.lbl{font-size:6.2px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.lines{background:repeating-linear-gradient(transparent 0 12px,var(--line) 12px 13px)}
.cb{display:inline-block;width:7px;height:7px;border:1px solid #BBA999;border-radius:2px;vertical-align:-1px;margin-right:4px;position:relative}
.cb.on{background:var(--olive);border-color:var(--olive)}
.cb.on:after{content:"";position:absolute;left:1.6px;top:0;width:2px;height:4px;border:solid #fff;border-width:0 1.2px 1.2px 0;transform:rotate(45deg)}
.g{display:grid;gap:7px}
.hand{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10px;color:#5C4A42}
.foot{position:absolute;left:28px;right:28px;bottom:14px;display:flex;justify-content:space-between;font-size:6px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.corner{position:absolute;opacity:.9}
.band{margin:-26px -28px 12px;padding:20px 28px 13px;background:linear-gradient(135deg,#6E2537,#521A29);display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--gold)}
.band .k{color:#E5D3AE}
.band .t{color:#FBF7F1;margin:3px 0 0}
.band .t i{color:#E5D3AE}

/* calendário */
.mini{font-size:5.6px;text-align:center}
.mini h4{font-family:'Playfair Display';font-weight:500;font-size:8.5px;color:var(--terra);margin-bottom:2px;text-align:left}
.mini .d{display:grid;grid-template-columns:repeat(7,1fr);gap:1px 0}
.mini .d span{height:8.5px;line-height:8.5px}
.mini .d .w{color:var(--gold);font-weight:600}
.mini .d .h{background:var(--rose);border-radius:50%;color:var(--ink);font-weight:600}
.mini .d .s{color:var(--terra)}

/* espiral */
.ring{position:absolute;width:22px;height:7px;border-radius:4px;background:linear-gradient(180deg,#f2efe9,#a9a39a 55%,#6f6a63);box-shadow:0 1px 1px rgba(0,0,0,.25)}
.hole{position:absolute;width:6px;height:6px;border-radius:50%;background:#d9cfc3;box-shadow:inset 0 1px 1px rgba(0,0,0,.25)}

/* tablet */
.tablet{position:relative;padding:18px;border-radius:32px;background:linear-gradient(145deg,#F3EEE6,#CFC5B6);box-shadow:inset 0 0 0 2px #FFFFFF,inset 0 0 0 3px #BDB2A2,0 30px 50px -18px rgba(50,30,20,.55),0 6px 14px rgba(50,30,20,.25)}
.tablet .scr{display:flex;border-radius:8px;overflow:hidden;background:var(--paper)}
.tabs{width:30px;display:flex;flex-direction:column;gap:3px;padding:24px 0 0 3px;background:var(--paper)}
.tabs span{height:34px;border-radius:0 6px 6px 0;font-size:6px;writing-mode:vertical-rl;text-align:center;line-height:22px;font-weight:600;letter-spacing:.1em;color:var(--ink)}
.cam{position:absolute;top:8px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#111}
</style>
</head>
<body>
<script>
// ---------- utilidades ----------
const C = {rose:'#E9CFC6',rose2:'#C99A93',terra:'#6E2537',gold:'#B08A4A',olive:'#5E6B47',olivel:'#DCDFCC',ink:'#2B2422'};

function sprig(){ return ""; } // rebranding: sem folhas
const MARK=(c="#B08A4A",s=12)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none"><path d="M12 1.5L22.5 12 12 22.5 1.5 12z" stroke="${c}" stroke-width="1.1"/><path d="M12 6.5v11M8.3 10.2h7.4" stroke="${c}" stroke-width="1.5" stroke-linecap="round"/></svg>`;
const lines=(h)=>`<div class="lines" style="height:${h}px"></div>`;
const head=(k,t,extra="")=>`<div class="band"><div><div class="k">${k}</div><div class="t">${t}</div></div>${MARK("#E5D3AE",20)}</div>${extra}`;
const foot=(l,r)=>`<div class="foot"><span>${l}</span><span>${r}</span></div>`;

// ---------- calendário 2027 ----------
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const FERIADOS={'0-1':1,'1-9':1,'2-26':1,'3-21':1,'4-1':1,'4-27':1,'8-7':1,'9-12':1,'10-2':1,'10-15':1,'10-20':1,'11-25':1};
function miniMonth(m){
  const first=new Date(2027,m,1).getDay(), days=new Date(2027,m+1,0).getDate();
  let d='DSTQQSS'.split('').map(x=>`<span class="w">${x}</span>`).join('');
  for(let i=0;i<first;i++) d+='<span></span>';
  for(let i=1;i<=days;i++){const dow=(first+i-1)%7; d+=`<span class="${FERIADOS[m+'-'+i]?'h':(dow===0?'s':'')}">${i}</span>`;}
  return `<div class="mini"><h4>${MESES[m]}</h4><div class="d">${d}</div></div>`;
}

// ---------- páginas ----------
const P={};
P.capa=(nome="Ana",c=["#7A2A3E","#5A1C2C","#3E1220"])=>`<div class="pg" style="background:radial-gradient(circle at 50% 36%,${c[0]} 0,${c[1]} 55%,${c[2]} 100%);padding:0;text-align:center;color:#FBF7F1">
  <div style="position:absolute;inset:14px;border:1px solid rgba(229,211,174,.7);border-radius:3px"></div>
  <div style="position:absolute;inset:19px;border:.6px solid rgba(229,211,174,.4);border-radius:2px"></div>
  ${["left:8px;top:8px","right:8px;top:8px","left:8px;bottom:8px","right:8px;bottom:8px"].map(p=>`<div style="position:absolute;${p}">${MARK("#D9BE86",14)}</div>`).join("")}
  <div style="position:absolute;top:92px;left:0;right:0">
    <div style="display:flex;justify-content:center">${MARK("#D9BE86",34)}</div>
    <div class="k" style="font-size:8px;letter-spacing:.42em;color:#E5D3AE;margin-top:16px">Planner Cristão</div>
    <div style="font-family:'Playfair Display';font-style:italic;font-size:30px;color:#FBF7F1;line-height:1;margin-top:26px">Planner da</div>
    <div style="font-family:'Great Vibes',cursive;font-size:98px;line-height:1.05;margin-top:2px;background:linear-gradient(180deg,#F1DFB5,#C9A260 60%,#A9843F);-webkit-background-clip:text;color:transparent">${nome}</div>
    <div style="font-family:'Playfair Display';font-size:60px;line-height:1;letter-spacing:.06em;margin-top:6px;background:linear-gradient(180deg,#F1DFB5,#B08A4A);-webkit-background-clip:text;color:transparent">2027</div>
    <div style="width:110px;height:1px;background:#D9BE86;margin:18px auto 12px"></div>
    <div style="font-family:'Cormorant Garamond';font-style:italic;font-size:14px;color:#F3E6DA">Feito exclusivamente para você</div>
  </div>
  <div style="position:absolute;bottom:52px;left:64px;right:64px;font-family:'Cormorant Garamond';font-style:italic;font-size:11px;color:#E5D3AE;line-height:1.35">
    “Ensina-nos a contar os nossos dias, de tal maneira que alcancemos coração sábio.”<br><span style="font-family:Inter;font-style:normal;font-size:6.5px;letter-spacing:.2em">SALMOS 90:12</span></div>
</div>`;

P.retro=()=>`<div class="pg">${head('Fechando o ano com gratidão','Retrospectiva <i>2026</i>')}
  <div class="v" style="margin-bottom:10px">“As misericórdias do Senhor são a causa de não sermos consumidos; […] novas são cada manhã; grande é a tua fidelidade.”<b>Lamentações 3:22-23</b></div>
  <div class="g" style="grid-template-columns:1fr 1fr">
    <div class="box"><div class="lbl">Sou grata a Deus por…</div><div class="hand" style="margin-bottom:-2px">a saúde da minha mãe 🤍</div>${lines(98)}</div>
    <div class="box"><div class="lbl">O que eu aprendi</div>${lines(110)}</div>
    <div class="box"><div class="lbl">Orações respondidas</div>${lines(84)}</div>
    <div class="box"><div class="lbl">O que deixo para trás</div>${lines(84)}</div>
  </div>
  <div class="box" style="margin-top:7px"><div class="lbl">Momentos que marcaram meu ano</div>
    <div class="g" style="grid-template-columns:repeat(4,1fr);gap:6px">${'<div style="height:62px;border:1px dashed #D8C8B8;border-radius:4px;background:#FBF5EE"></div>'.repeat(4)}</div></div>
  ${foot('Planner Cristão 2027','Retrospectiva')}</div>`;

const AREAS=[['Espiritual','✝'],['Família','♡'],['Saúde','✿'],['Finanças','$'],['Trabalho','✎']];
P.metas=()=>`<div class="pg">${head('Onde quero chegar','Metas <i>2027</i>')}
  <div class="box" style="text-align:center;margin-bottom:8px;background:#FBF3E8"><div class="lbl">Minha palavra para 2027</div><div class="hand" style="font-size:15px;color:var(--terra)">Constância</div></div>
  <div class="g" style="grid-template-columns:1fr 1fr">
  ${AREAS.map(([a,ic],i)=>`<div class="box" ${i===4?'style="grid-column:span 2"':''}><div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
     <span style="width:17px;height:17px;border-radius:50%;background:${i%2?C.olivel:C.rose};display:grid;place-items:center;font-size:8px">${ic}</span>
     <b style="font-family:'Playfair Display';font-weight:500;font-size:10.5px">${a}</b></div>
     ${[0,1,2,3].map(j=>`<div style="border-bottom:1px solid var(--line);padding:3px 0"><span class="cb ${i===0&&j===0?'on':''}"></span>${i===0&&j===0?'<span class="hand">Ler a Bíblia inteira</span>':''}</div>`).join('')}
   </div>`).join('')}</div>
  <div class="box" style="margin-top:7px;background:#FBF3E8"><div class="lbl">Meu primeiro passo ainda esta semana</div>${lines(40)}</div>
  ${foot('Planner Cristão 2027','Metas')}</div>`;

P.calendario=()=>`<div class="pg">${head('Um ano inteiro nas mãos de Deus','Calendário <i>2027</i>')}
  <div class="g" style="grid-template-columns:repeat(3,1fr);gap:10px 14px">${MESES.map((_,m)=>miniMonth(m)).join('')}</div>
  <div class="box" style="margin-top:10px;font-size:6.2px;line-height:1.55;columns:2">
    <div class="lbl">Feriados nacionais 2027</div>
    01/01 Confraternização Universal<br>09/02 Carnaval*<br>26/03 Sexta-feira Santa<br>21/04 Tiradentes<br>01/05 Dia do Trabalho<br>27/05 Corpus Christi*<br>
    07/09 Independência<br>12/10 N. Sra. Aparecida<br>02/11 Finados<br>15/11 Proclamação da República<br>20/11 Consciência Negra<br>25/12 Natal</div>
  ${foot('Planner Cristão 2027','* ponto facultativo')}</div>`;

P.mensal=()=>{const first=new Date(2027,0,1).getDay();let cells='';
  for(let i=0;i<35;i++){const d=i-first+1;cells+=`<div style="border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:47px;padding:2px 3px;font-size:6.5px;color:${d===1?C.terra:'#6B5E58'}">${d>0&&d<=31?d:''}${d===1?'<div class="hand" style="font-size:7.5px;margin-top:2px">Ano novo 🤍</div>':''}${d===10?'<div style="margin-top:3px;height:9px;border-radius:2px;background:var(--rose);font-size:5.5px;padding-left:2px">Culto 19h</div>':''}</div>`;}
  return `<div class="pg">${head('Mês 01','Janeiro <i>2027</i>')}
  <div class="v" style="margin-bottom:9px">“Confia ao Senhor as tuas obras, e teus pensamentos serão estabelecidos.”<b>Provérbios 16:3</b></div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)">
   ${'Dom Seg Ter Qua Qui Sex Sáb'.split(' ').map(x=>`<div style="border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:6px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:3px;background:#FBF3E8;color:var(--gold);font-weight:600">${x}</div>`).join('')}${cells}</div>
  <div class="g" style="grid-template-columns:1fr 1fr;margin-top:8px">
   <div class="box"><div class="lbl">Prioridades do mês</div>${lines(52)}</div>
   <div class="box"><div class="lbl">Motivos de oração</div>${lines(52)}</div></div>
  ${foot('Planner Cristão 2027','Janeiro')}</div>`;};

P.semanal=()=>{const dias=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  return `<div class="pg">${head('Semana 01 · 04 a 10 de janeiro','Minha <i>semana</i>')}
  <div class="v" style="margin-bottom:9px;font-size:12px">“Mas buscai primeiro o Reino de Deus, e a sua justiça, e todas essas coisas vos serão acrescentadas.”<b>Versículo da semana · Mateus 6:33</b></div>
  <div class="g" style="grid-template-columns:1fr 1fr;gap:6px">
   ${dias.map((d,i)=>`<div class="box" style="padding:5px 7px"><div style="display:flex;justify-content:space-between"><b style="font-family:'Playfair Display';font-weight:500;font-size:9.5px;color:${i===6?C.terra:C.ink}">${d}</b><span style="font-size:6px;color:var(--muted)">${String(4+i).padStart(2,'0')}/01</span></div>
     ${i===0?'<div style="padding-top:2px"><span class="cb on"></span><span class="hand">Devocional às 6h</span></div><div><span class="cb"></span><span class="hand">Mercado</span></div>':''}${lines(i===0?44:i===6?58:72)}</div>`).join('')}
   <div class="box" style="padding:5px 7px;background:#F6F1E6"><div class="lbl">Tarefas</div>${[0,1,2,3].map(()=>`<div style="border-bottom:1px solid var(--line);padding:2px 0"><span class="cb"></span></div>`).join('')}</div>
  </div>
  ${foot('Planner Cristão 2027','Semanal')}</div>`;};

const REFS=['Gn 1–3','Gn 4–7','Gn 8–11','Gn 12–15','Gn 16–18','Gn 19–21','Gn 22–24','Gn 25–27','Gn 28–30','Gn 31–33','Gn 34–36','Gn 37–39','Gn 40–42','Gn 43–46','Gn 47–50','Êx 1–3','Êx 4–6','Êx 7–9','Êx 10–12','Êx 13–15','Êx 16–18','Êx 19–21','Êx 22–24','Êx 25–27','Êx 28–30','Êx 31–33','Êx 34–36','Êx 37–40','Lv 1–4','Lv 5–7'];
const SAL=['Sl 1','Sl 2','Sl 3','Sl 4','Sl 5','Sl 6','Sl 7','Sl 8','Sl 9','Sl 10','Sl 11','Sl 12','Sl 13','Sl 14','Sl 15'];
P.leitura=()=>{const col=(a,b)=>`<div>${REFS.slice(a,b).map((r,i)=>`<div style="display:flex;align-items:center;border-bottom:1px solid var(--line);padding:3.4px 2px;font-size:7.2px">
   <span class="cb ${a+i<11?'on':''}"></span><span style="width:30px;color:var(--muted);font-size:6.2px">Dia ${a+i+1}</span><span style="flex:1">${r}</span><span style="color:var(--olive);font-size:6.2px">${SAL[(a+i)%15]}</span></div>`).join('')}</div>`;
  return `<div class="pg">${head('A Bíblia inteira em 1 ano','Plano de <i>leitura</i>')}
  <div style="display:flex;gap:8px;margin-bottom:9px">
   <div class="box" style="flex:1;display:flex;align-items:center;gap:8px"><div style="width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--olive) 0 11%,var(--olivel) 0);display:grid;place-items:center"><div style="width:26px;height:26px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:7px;font-weight:600">3%</div></div>
     <div><div class="lbl" style="margin:0">Progresso</div><div class="hand">11 de 365 dias</div></div></div>
   <div class="v" style="flex:1.6">“Lâmpada para os meus pés é tua palavra e luz, para o meu caminho.”<b>Salmos 119:105</b></div></div>
  <div class="g" style="grid-template-columns:1fr 1fr;gap:12px">${col(0,15)}${col(15,30)}</div>
  <div class="box" style="margin-top:9px"><div class="lbl">O versículo que mais falou comigo</div>${lines(38)}</div>
  ${foot('Planner Cristão 2027','Plano de leitura · Parte 1')}</div>`;};

P.oracao=()=>{const rows=[['03/01','Emprego do meu irmão','12/02 🙌'],['05/01','Saúde da vó Lúcia',''],['08/01','Sabedoria com as crianças',''],['','',''],['','',''],['','',''],['','',''],['','','']];
  return `<div class="pg">${head('Pedidos, respostas e gratidão','Diário de <i>oração</i>')}
  <div class="v" style="margin-bottom:9px">“Não estejais inquietos por coisa alguma; antes, as vossas petições sejam em tudo conhecidas diante de Deus, pela oração e súplica, com ação de graças.”<b>Filipenses 4:6</b></div>
  <div style="display:grid;grid-template-columns:42px 1fr 64px;font-size:6.2px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;border-bottom:1px solid var(--gold);padding-bottom:3px"><span>Data</span><span>Meu pedido</span><span>Respondida</span></div>
  ${rows.map(r=>`<div style="display:grid;grid-template-columns:42px 1fr 64px;border-bottom:1px solid var(--line);height:21px;align-items:end;padding-bottom:2px" class="hand"><span style="font-size:8.5px">${r[0]}</span><span>${r[1]}</span><span style="color:var(--olive)">${r[2]}</span></div>`).join('')}
  <div class="g" style="grid-template-columns:1fr 1fr;margin-top:9px">
   <div class="box" style="background:#FBF0EC"><div class="lbl">Hoje sou grata por…</div>${lines(66)}</div>
   <div class="box"><div class="lbl">Estou orando por</div>${['Meu marido','Meus filhos','Minha igreja','O Brasil'].map(x=>`<div style="border-bottom:1px solid var(--line);padding:3px 0"><span class="cb"></span>${x}</div>`).join('')}</div></div>
  ${foot('Planner Cristão 2027','Oração')}</div>`;};

P.devocional=()=>`<div class="pg">${head('Devocional semanal','Anotações do <i>culto</i>')}
  <div class="g" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:7px">${['Data','Igreja','Pregador(a)'].map(x=>`<div class="box" style="padding:5px 7px"><div class="lbl">${x}</div><div style="height:9px;border-bottom:1px solid var(--line)"></div></div>`).join('')}</div>
  <div class="box" style="margin-bottom:7px;background:#FBF3E8"><div class="lbl">Texto base</div><div class="hand" style="font-size:11px">Josué 1:9 — “Esforça-te e tem bom ânimo…”</div></div>
  <div class="box" style="margin-bottom:7px"><div class="lbl">Pontos principais da pregação</div>${['1.','2.','3.'].map(n=>`<div style="border-bottom:1px solid var(--line);padding:4px 0;color:var(--gold)">${n}</div>`).join('')}</div>
  <div class="g" style="grid-template-columns:1fr 1fr">
   <div class="box"><div class="lbl">O que Deus falou comigo</div>${lines(176)}</div>
   <div class="box"><div class="lbl">Como vou aplicar esta semana</div>${lines(176)}</div></div>
  ${foot('Planner Cristão 2027','Devocional')}</div>`;

P.financas=()=>{const tot=[['Entradas','R$ 0,00',C.olivel],['Dízimo','10%',C.rose],['Ofertas','R$ ',C.rose],['Gastos','R$ ',C.olivel]];
  const fx=['Aluguel / financiamento','Água e luz','Internet','Mercado','Escola das crianças','Transporte','Reserva de emergência',''];
  return `<div class="pg">${head('Janeiro · Mordomia com alegria','Planner <i>financeiro</i>')}
  <div class="v" style="margin-bottom:9px">“Honra ao Senhor com a tua fazenda e com as primícias de toda a tua renda.”<b>Provérbios 3:9</b></div>

P.habitos=()=>{const hs=['Oração','Leitura bíblica','Devocional','Exercício','Dormir cedo','Sem redes à noite'];

    <span></span>${Array.from({length:16},(_,i)=>`<span style="text-align:center;color:var(--muted);font-size:5.5px">${i+1}</span>`).join('')}

   </div></div>
  <div class="g" style="grid-template-columns:1.25fr 1fr;margin-top:8px">

     ${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map((d,r)=>`<div style="display:flex;align-items:center;gap:3px;padding:2px 0;border-bottom:1px solid var(--line)"><span style="width:20px;font-size:6.4px">${d}</span>${Array.from({length:8},(_,i)=>drop(r<3&&i<(r===1?6:8))).join('')}</div>`).join('')}</div>
   <div class="box"><div class="lbl">Livros que vou ler</div>
     ${['','','','',''].map((_,i)=>`<div style="display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--line);padding:3px 0"><span style="width:7px;height:16px;border-radius:1px;background:${[C.terra,C.olive,C.gold,C.rose2,C.olivel][i]}"></span><span style="flex:1"></span><span style="color:var(--gold);font-size:7px">☆☆☆☆☆</span></div>`).join('')}</div></div>

</div>`;

const place=(html,x,y,s=1,r=0,cls='',extra='')=>`<div class="abs ${cls}" style="left:${x}px;top:${y}px;transform:rotate(${r}deg) scale(${s});${extra}">${html}</div>`;
const sheet=(name)=>P[name]().replace('class="pg"','class="pg shadow"');
function spiralLeft(name){ // folha com espiral à esquerda
  let r='';for(let i=0;i<26;i++){r+=`<div class="hole" style="left:7px;top:${14+i*22.4}px"></div><div class="ring" style="left:-12px;top:${13.5+i*22.4}px"></div>`;}
  return `<div style="position:relative">${sheet(name)}${r}</div>`;
}
function tablet(name){
  const tabs=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `<div class="tablet"><div class="cam"></div><div class="scr" style="height:${594*.94}px">
    <div style="width:${420*.94}px;height:${594*.94}px;overflow:hidden"><div style="transform:scale(.94);transform-origin:0 0">${P[name]()}</div></div>
    <div class="tabs" style="padding-top:12px">${tabs.map((t,i)=>`<span style="background:${["#E9CFC6","#E5D3AE","#F1E7DA"][i%3]};height:${(594*.94-24)/12-3}px">${t}</span>`).join('')}</div></div></div>`;
}
function cup(){return `<div style="position:relative;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#fff 55%,#F2ECE4 70%,#E6DDD2);box-shadow:0 18px 30px -12px rgba(60,40,30,.45)">
  <div style="position:absolute;left:30px;top:30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 45% 40%,#fff,#EEE7DE);box-shadow:0 6px 12px rgba(60,40,30,.25)">
   <div style="position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8a6248,#5a3a28 55%,#3d271b);box-shadow:inset 0 3px 8px rgba(0,0,0,.45)">
    <div style="position:absolute;left:28px;top:24px;width:34px;height:20px;border-radius:50%;background:radial-gradient(#d9b99a,rgba(217,185,154,0) 70%);opacity:.8"></div></div></div>
  <div style="position:absolute;left:136px;top:72px;width:46px;height:24px;border-radius:12px;border:7px solid #F4EEE6;border-left:none;box-shadow:2px 3px 5px rgba(60,40,30,.2)"></div></div>`;}
function pen(len=300){return `<div style="width:${len}px;height:11px;border-radius:2px 6px 6px 2px;background:linear-gradient(180deg,#e7cf9e,#b9975b 50%,#8b6c3a);box-shadow:0 8px 12px -4px rgba(60,40,30,.4);position:relative">
  <div style="position:absolute;left:-20px;top:0;border-right:20px solid #d8c19a;border-top:5.5px solid transparent;border-bottom:5.5px solid transparent"></div>
  <div style="position:absolute;left:-26px;top:4px;width:7px;height:3px;background:#3d322d;border-radius:2px"></div>
  <div style="position:absolute;right:40px;top:-3px;width:70px;height:4px;border-radius:2px;background:#9b7b45"></div></div>`;}

const COR={vinho:["#7A2A3E","#5A1C2C","#3E1220"],rose:["#C98E92","#A8676E","#7C434B"],oliva:["#6E7A55","#525E3E","#363F29"]};
function spiralCover(nome,c){ // capa do planner físico com espiral à esquerda
  let r="";for(let i=0;i<24;i++){r+=`<div class="hole" style="left:9px;top:${22+i*23.5}px;background:rgba(0,0,0,.4)"></div><div class="ring" style="left:-12px;top:${21.5+i*23.5}px"></div>`;}
  return `<div style="position:relative;border-radius:2px 6px 6px 2px;box-shadow:0 2px 3px rgba(40,20,15,.25),0 24px 40px -14px rgba(40,20,15,.55)">${P.capa(nome,c)}${r}</div>`;
}
const capasComp=()=>`<div style="position:relative;width:640px;height:580px">
  ${place(spiralCover("Bia",COR.rose),40,122,.66,-11)}

</div>`;
const heroComp=()=>`<div style="position:relative;width:640px;height:580px">

     repeating-linear-gradient(90deg,rgba(150,115,80,.0) 0 199px,rgba(150,115,80,.18) 199px 201px),
     repeating-linear-gradient(1deg,rgba(160,120,80,.05) 0 2px,transparent 2px 7px),

     <div class="abs" style="left:-30px;top:380px;transform:rotate(-80deg)">${sprig(90,240,C.olive,11)}</div>
     ${place(sheet('oracao'),70,70,.86,-8)}

     <div class="abs" style="left:630px;top:385px">${cup()}</div>
     ${place(pen(300),170,610,1,-14)}`,
  tablet:()=>`<div class="abs" style="left:430px;top:340px;transform:rotate(35deg)">${sprig(70,190,C.olive,9)}</div>
     ${place(tablet('semanal'),70,20,.92,-3)}
     ${place(pen(330),250,560,1,-35)}`,
  espiral:()=>{let r='';for(let i=0;i<26;i++){r+=`<div class="ring" style="left:409px;top:${14+i*22.4}px;width:24px"></div>`;}
     return `<div class="abs" style="left:0;top:368px;transform:rotate(-62deg)">${sprig(80,200,C.olive,10)}</div>
     <div class="abs" style="left:46px;top:28px;transform:scale(.86) rotate(-2deg)"><div style="position:relative;display:flex;box-shadow:0 30px 50px -18px rgba(50,30,20,.5)">${P.semanal()}<div style="width:2px;background:#e9dfd3"></div>${P.devocional()}${r}</div></div>`;},
  og:()=>`<div style="position:absolute;inset:0;background:radial-gradient(circle at 75% 50%,#FBEFE6,#F3E6D6 70%)"></div>
     <div class="abs" style="left:-20px;top:420px;transform:rotate(-60deg)">${sprig(90,240,C.olive,11)}</div>
     <div class="abs" style="left:70px;top:120px;width:500px">
       <div class="k" style="font-size:16px;letter-spacing:.3em">Feito exclusivamente para você</div>
       <div style="font-family:'Playfair Display';font-size:60px;line-height:1.08;margin:16px 0 22px;color:var(--ink)">Seu Planner <i style="color:var(--terra)">2027</i> personalizado</div>
       <div style="font-size:25px;line-height:1.4;color:#5c4d45">Planner físico com o seu nome na capa, na cor que você escolher, + versão digital de presente.</div></div>
     <div class="abs" style="left:575px;top:40px;transform:scale(.92)">${capasComp()}</div>`
};

document.body.insertAdjacentHTML('beforeend', h.startsWith('page-') ? P[h.slice(5)]() : scenes[h]());
